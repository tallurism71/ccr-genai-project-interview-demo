services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: ccr, POSTGRES_USER: ccr, POSTGRES_PASSWORD: ccr }
    ports: ["5432:5432"]
    volumes: ["ccrdb:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ccr"], interval: 5s, timeout: 5s, retries: 10 }
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["9092:9092"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/ccr
      DB_USER: ccr
      DB_PASSWORD: ccr
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SECURITY_MODE: local
      RAG_MODE: mock
      LLM_MODE: mock
      LLM_BASE_URL: http://host.docker.internal:8000/v1
      LLM_MODEL: local-model
    depends_on: { db: { condition: service_healthy }, kafka: { condition: service_started } }
    ports: ["8080:8080"]
  frontend:
    build: { context: ./frontend, args: { VITE_API_URL: "http://localhost:8080/api" } }
    depends_on: [backend]
    ports: ["3000:80"]
volumes: { ccrdb: {} }
