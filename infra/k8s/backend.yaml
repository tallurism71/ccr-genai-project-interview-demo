apiVersion: apps/v1
kind: Deployment
metadata: {name: ccr-backend}
spec:
  replicas: 2
  selector: {matchLabels: {app: ccr-backend}}
  template:
    metadata: {labels: {app: ccr-backend}}
    spec:
      serviceAccountName: ccr-backend
      containers:
        - name: backend
          image: REPLACE_ECR_URI/ccr-backend:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: SECURITY_MODE, value: oidc}
            - {name: KAFKA_ENABLED, value: "true"}
            - {name: RAG_MODE, value: enterprise}
          envFrom: [{secretRef: {name: ccr-runtime}}]
          readinessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: ccr-backend}
spec: {selector: {app: ccr-backend}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ccr-backend}
